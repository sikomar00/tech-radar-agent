name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          # 별칭 정렬 시험은 코드포인트 순서(영문 → 한글)를 기대한다. 이미지 기본값 en_US.utf8은 순서가 달라진다.
          POSTGRES_INITDB_ARGS: --locale=C.UTF-8
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      # Supabase는 pg_trgm을 extensions 스키마에 둔다. 일반 PostgreSQL에서도 같은 위치를 만든다.
      - run: psql "$DATABASE_URL" -c "create schema if not exists extensions"
      - run: python -m pytest -q
